# Test profile: in-memory H2 + dummy secrets so the Spring context can start
# without remote MySQL or real cloud credentials. Activated via @ActiveProfiles("test").

# H2 in-memory datasource (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:paperhub_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Context-load only: do not generate/validate schema against H2
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Dummy values for mandatory @Value placeholders (never real secrets)
jwt.secret=test-only-secret-not-for-production-0123456789abcdef0123456789
huawei.obs.ak=test-ak
huawei.obs.sk=test-sk
huawei.obs.endpoint=obs.test.local
huawei.obs.bucketName=test-bucket

# Redis (dev localhost is up; connection is lazy at startup)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

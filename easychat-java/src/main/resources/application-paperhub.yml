# EasyChat PaperHub集成配置
server:
  port: 8081
  servlet:
    context-path: /

# 数据库配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://124.70.87.106:3306/easychat02?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

  # Redis配置
  redis:
    host: 124.70.87.106
    port: 6379
    password: 123456
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 20
        max-wait: -1
        max-idle: 8
        min-idle: 0

# 文件上传配置
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# 日志配置
logging:
  level:
    com.easychat: debug
    org.springframework.web: info

# 应用配置
app:
  # 项目文件夹路径
  projectFolder: /app/files/
  # 允许的跨域域名
  corsOrigins: http://localhost:3000,http://localhost:8080
  # 文件上传类型限制
  allowedFileTypes: jpg,jpeg,png,gif,pdf,doc,docx,txt,mp3,mp4

# PaperHub集成配置
paperhub:
  # PaperHub后端地址
  baseUrl: http://localhost:8080
  # 认证令牌密钥
  tokenSecret: paperhub-integration-secret
  # 启用PaperHub集成
  enabled: true